/* Layout: one mushaf page fills the screen; ayahs that carry a mutashabih discussion are tinted; tapping one raises a sheet with a tab per encyclopedia and a card per entry. */
:root{
  --paper:#ffffff; --paper-edge:#f4f1ea; --ink:#111111; --ink-soft:#5d5442; --cart:#7fae96; --cart-bg:#eef6f0;
  --frame:#14463f; --bar:#4f7d4b; --gold:#a7822e; --cart-bg2:#fdfaf1; --sheet:#fffdf7; --line:#e3d8bb;
  --hl:rgba(31,107,96,.13); --hl-ink:#0f6b5c; --focus:#1f6b60;
  --tam:#14634f; --kafi:#2c6fa3; --hasan:#8a6a12; --weak:#9a5a2a; --neg:#a3322a; --lazim:#5b2a86; --other:#6b6458;
  --f-quran:"Amiri Quran","Amiri",serif;
  --f-uth:"KFGQPC Hafs","Amiri Quran","Amiri",serif;
  --f-display:"Amiri","Traditional Arabic",serif;
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141412; --paper-edge:#1d1c19; --ink:#ece6d6; --cart:#4f7d68; --cart-bg:#1b2621; --ink-soft:#b5aa90;
  --frame:#4fa393; --bar:#2f4f2e; --gold:#d3b06a; --cart-bg2:#1f1d18; --sheet:#22201a; --line:#3a3528;
  --hl:rgba(108,194,177,.16); --hl-ink:#7fd6c4; --focus:#6cc2b1;
  --tam:#4fbf9c; --kafi:#6aa9dc; --hasan:#d6b55a; --weak:#d89160; --neg:#e07a70; --lazim:#b48ae0; --other:#a59d8c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141412; --paper-edge:#1d1c19; --ink:#ece6d6; --cart:#4f7d68; --cart-bg:#1b2621; --ink-soft:#b5aa90;
  --frame:#4fa393; --bar:#2f4f2e; --gold:#d3b06a; --cart-bg2:#1f1d18; --sheet:#22201a; --line:#3a3528;
  --hl:rgba(108,194,177,.16); --hl-ink:#7fd6c4; --focus:#6cc2b1;
  --tam:#4fbf9c; --kafi:#6aa9dc; --hasan:#d6b55a; --weak:#d89160; --neg:#e07a70; --lazim:#b48ae0; --other:#a59d8c;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--paper-edge);color:var(--ink);font-family:var(--f-ui);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
body:not(.chrome)::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* floating toolbars (shown on tap, over the page, like mushaf reading apps) */
.fbar{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:20;
  background:var(--bar);color:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);
  transition:opacity .22s,transform .22s;max-width:760px;margin:0 auto}
.fbar.top{top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:2px;padding:6px 8px}
.fbar.bot{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px 10px 6px}
body:not(.chrome) .fbar{opacity:0;pointer-events:none}
body:not(.chrome) .fbar.top{transform:translateY(-12px)}
body:not(.chrome) .fbar.bot{transform:translateY(12px)}
.fbar .title{flex:1;min-width:0;text-align:center;line-height:1.15}
.fbar .sname{display:block;font-family:var(--f-display);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .meta{display:block;font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
.fbar .row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:#fff;flex:none}
.ibtn:active{background:rgba(255,255,255,.16)}
.ibtn[aria-pressed="true"]{background:rgba(255,255,255,.2)}
.ibtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fbar input#pgIn{width:64px;height:34px;text-align:center;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:600;font-variant-numeric:tabular-nums}
#pgRange{width:100%;height:24px;margin:0;accent-color:#e9d8a6;direction:rtl;background:transparent}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:rgba(20,20,18,.85);color:#fff;
  font-size:14px;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* page — styled like the printed Madinah page in mushaf apps: plain page, running head, 15 justified lines, page cartouche */
#stage{flex:1;min-height:0;overflow:auto;overflow-x:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;background:var(--paper);touch-action:pan-y;position:relative;
  padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.page{will-change:transform;background:var(--paper);width:100%;max-width:760px;display:flex;flex-direction:column;position:relative;align-self:flex-start}
.page.fixed{height:100%;align-self:stretch}
.page.fixed .lines{flex:1;justify-content:space-between;min-height:0}
.page.fixed .line{min-height:0;line-height:1.25}
.phead{display:flex;justify-content:space-between;align-items:center;direction:rtl;font-family:var(--f-ui);font-size:15px;color:var(--ink);padding:0 4px 2px;min-height:30px}
.phead .g{font-family:q4f0;font-size:32px;line-height:1;font-weight:400}
.phead .ps{font-family:var(--f-display);font-size:18px}
.lines{display:flex;flex-direction:column;direction:rtl;color:var(--ink)}
.line{display:flex;justify-content:space-between;align-items:center;white-space:nowrap;min-height:1.95em;line-height:1.95}
.line.center{justify-content:center;gap:.3em}
.w{cursor:pointer;border-radius:4px;position:relative;transition:background .15s}
.w.hl{color:var(--hl-ink)}
.w.tap{background:var(--hl);border-radius:4px}
.w.found{background:color-mix(in srgb,var(--gold) 38%,transparent);border-radius:4px;box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 38%,transparent)}
.sq{display:flex;gap:8px;align-items:center;padding:4px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--sheet)}
.sq input{flex:1;min-width:0;font:400 19px/1.4 var(--f-ui);padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);direction:rtl}
.sq input:focus{outline:2px solid color-mix(in srgb,var(--frame) 45%,transparent);border-color:transparent}
.scount{font-size:13px;color:var(--ink-soft);margin:0 2px 10px}
.sres{display:block;width:100%;text-align:right;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 8px;color:var(--ink);font:inherit}
.sres .ref{display:flex;justify-content:space-between;font:600 13px/1.6 var(--f-ui);color:var(--frame)}
.sres .ref span{color:var(--ink-soft);font-weight:400}
.sres .tx{font:400 19px/1.9 var(--f-quran);margin-top:2px}
.sres .tx mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.sres.sur .tx{font:700 18px/1.6 var(--f-display)}
body.marks .w.has::after{content:"";position:absolute;left:50%;bottom:.08em;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--focus);opacity:.55}
/* one imam chosen: his ruling is written above the word, like the pause signs of the printed mushaf */
body.marks .w.has[data-m]::after{content:attr(data-m);bottom:auto;top:-.62em;width:auto;height:auto;margin:0;transform:translateX(-50%);opacity:1;
  font:700 .46em/1 var(--f-ui);color:#fff;background:var(--cc,var(--focus));border-radius:.5em;padding:.14em .32em .18em;white-space:nowrap;letter-spacing:0;
  box-shadow:0 0 0 .1em var(--paper);z-index:2}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip-i{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:17px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.chip-i i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--bar);font:700 12px/1 var(--f-display)}
.chip-i[aria-pressed="true"]{background:#f3e3b3;color:#2c3a20}
.chip-i[aria-pressed="true"] i{background:var(--bar);color:#fff}
.mleg{font-size:11.5px;opacity:.9;padding:0 2px 6px;line-height:1.5}
.onlyTag{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:15;font-size:12px;font-weight:600;
  background:var(--bar);color:#fff;border-radius:12px;padding:3px 10px;opacity:.85;transition:opacity .2s}
body.chrome .onlyTag,.onlyTag:empty{opacity:0;pointer-events:none}
.end{color:var(--ink)}
.basm{justify-content:center;font-family:var(--f-quran)}
/* surah header — four styles, chosen with body[data-hdr]; the name is the calligraphic glyph of the 1441 print, flanked by its own flourishes */
.shead{justify-content:center;align-items:center;position:relative;margin:.04em 0;height:1.62em;min-height:1.62em!important;padding:0;gap:.12em}
.shead .nm{position:relative;z-index:1;line-height:1;white-space:nowrap}
.shead .nm.t{font-family:var(--f-display);font-weight:700;font-size:.7em}
.shead .nm.g{font-family:q4f0;font-size:1.3em}
.shead .fl{position:relative;z-index:1;font-family:q4f0;font-size:1.15em;line-height:1;color:var(--gold)}
.shead .rule,.shead svg{display:none}
.shead .fr::before{content:"\FAE5"}.shead .fl2::before{content:"\FAE4"}
/* 1 gold cartouche with pointed ends */
body[data-hdr="1"] .shead svg{display:block;position:absolute;inset:0;width:100%;height:100%}
body[data-hdr="1"] .shead .nm{color:#3b2a10}
/* 2 calligraphy and flourishes with double rules, no frame */
body[data-hdr="2"] .shead .rule{display:block;flex:1;height:.2em;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
body[data-hdr="2"] .shead .nm{color:var(--ink);font-size:1.38em}
body[data-hdr="2"] .shead .fr::before{content:"\FAF5"}body[data-hdr="2"] .shead .fl2::before{content:"\FAF4"}
/* 3 calm green band with gold hairline */
body[data-hdr="3"] .shead{background:#2f5d45;border-radius:.24em;box-shadow:inset 0 0 0 .12em #2f5d45,inset 0 0 0 .16em #d9c27e}
body[data-hdr="3"] .shead::before{content:"";position:absolute;left:25%;right:25%;top:.2em;bottom:.2em;background:#fbf7ea;border:1.5px solid #d9c27e;border-radius:1em}
body[data-hdr="3"] .shead .nm{color:#2f5d45;font-size:1.15em}body[data-hdr="3"] .shead .nm.t{font-size:.66em}
body[data-hdr="3"] .shead .fl{font-size:.85em}
body[data-hdr="3"] .shead .fr::before{content:"\FAE7"}body[data-hdr="3"] .shead .fl2::before{content:"\FAE6"}
/* 4 simple double-line frame, flourishes at the ends */
body[data-hdr="4"] .shead{justify-content:space-between;padding:0 .3em;margin:.18em .16em;height:1.5em;min-height:1.5em!important;
  border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:.12em;background:var(--cart-bg2)}
body[data-hdr="4"] .shead .nm{color:var(--ink)}
body[data-hdr="4"] .shead .fr::before{content:"\FAFD"}body[data-hdr="4"] .shead .fl2::before{content:"\FAFC"}
.shead.banner{background:url(img/surah_banner.webp) center/100% 100% no-repeat!important;box-shadow:none!important;outline:0!important;border:0!important;
  padding:0!important;margin:.05em 0!important;height:auto!important;min-height:0!important;aspect-ratio:1400/165;width:100%;align-self:center}
.shead.banner::before,.shead.banner svg,.shead.banner .rule,.shead.banner .fl{display:none!important}
.shead.banner .nm.g{font-size:1.32em;color:#1f2a1c;transform:translateY(-.04em)}
/* dark mode: the banner's central cartouche is see-through, so the name needs a light colour to stay readable */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .shead.banner .nm.g{color:var(--gold)}}
:root[data-theme="dark"] .shead.banner .nm.g{color:var(--gold)}
/* phone held sideways: keep the page's book proportions and scroll down, instead of squeezing 15 lines into the short height */
@media (orientation:landscape) and (max-height:600px){
  .page.fixed{height:auto;max-width:min(640px,100%)}
  .page.fixed .lines{justify-content:flex-start}
  .page.fixed .line{line-height:1.9}
}
.basm.glyph{font-size:.92em}
.page.q4 .basm span{font-size:1em}
.qtr{color:var(--gold);font-size:1.45em;vertical-align:-.08em;line-height:0} /* the rub' al-hizb mark, larger and gilt as in the printed page */
.page>.shead{font-size:24px;margin:6px 0}
.flow{direction:rtl;text-align:justify;text-align-last:center;font-family:var(--f-quran);line-height:2.3;font-size:22px}
.flow .num{font-family:var(--f-display);font-size:.78em;margin:0 .12em;display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;
  border:1.5px solid var(--cart);border-radius:50%;line-height:1;vertical-align:.15em;background:var(--cart-bg)}
.pfoot{display:flex;justify-content:center;margin-top:6px}
.pfoot span{font-family:var(--f-display);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);
  border:1px solid var(--gold);background:var(--cart-bg2);border-radius:10px;padding:0 22px;line-height:1.7;box-shadow:0 0 0 2px var(--cart-bg2),0 0 0 3px var(--gold)}
.notice{flex:0 0 100%;max-width:620px;margin:0 auto 8px;font-size:12.5px;color:var(--ink-soft);background:var(--sheet);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.loading{padding:60px 0;text-align:center;color:var(--ink-soft)}
/* neighbouring page shown beside the current one while swiping */
.ghost{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none;background:var(--paper);
  padding:inherit;box-sizing:border-box;will-change:transform}


/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:50;background:var(--sheet);border-radius:18px 18px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:86%;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .25s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet.tall{height:92vh;height:92dvh;max-height:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grip{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.shd{display:flex;align-items:center;gap:8px;padding:4px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.shd h2{flex:1;margin:0;font-family:var(--f-display);font-size:19px;color:var(--frame)}
.shd .x{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-soft)}
.shd .x.share{width:auto;display:flex;gap:4px;padding:0 12px;border:1px solid var(--line);border-radius:18px;color:var(--frame);font:600 13px var(--f-ui)}
.shd .x.share svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shd .x.share[hidden]{display:none}
.pdfdlg{position:fixed;inset:auto 12px calc(18px + env(safe-area-inset-bottom,0px));z-index:70;max-width:420px;margin:0 auto;background:var(--sheet);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:14px 16px;direction:rtl}
.pdfdlg p{margin:0 0 10px;font:500 15px/1.6 var(--f-ui);color:var(--ink)}
.pdfdlg .row{display:flex;gap:8px}
.pdfdlg button,.pdfdlg a{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);font:600 15px var(--f-ui);color:var(--frame);background:transparent;text-decoration:none}
.pdfdlg .main{background:var(--frame);border-color:var(--frame);color:#fff}
.sbody{overflow:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.ayah{font-family:var(--f-quran);font-size:22px;line-height:2.2;direction:rtl;text-align:center;margin:0 0 10px}
.ayah .aw{padding:0 3px;cursor:pointer;border-radius:6px;border-bottom:2.5px solid transparent;transition:background .15s}
.ayah .aw.has{border-bottom:2px dotted var(--focus)}
.ayah .aw.sel{background:var(--hl)}
.ayah .an{color:var(--ink-soft);font-size:.8em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:1px 10px;border-radius:999px;line-height:1.7;white-space:nowrap;
  color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.c-tam{--cc:var(--tam)}.c-kafi{--cc:var(--kafi)}.c-hasan{--cc:var(--hasan)}.c-weak{--cc:var(--weak)}.c-neg{--cc:var(--neg)}.c-lazim{--cc:var(--lazim)}.c-other{--cc:var(--other)}.c-ibtida{--cc:var(--frame)}
.sheet{direction:rtl}
.sbody{background:var(--paper-edge)}
.shd{border-bottom:0!important;padding-top:8px!important}
.shd h2{display:flex;flex-direction:column;gap:2px;font-family:var(--f-ui)!important;font-weight:400!important}
.shd h2 small{font-size:13px;color:var(--ink-soft)}
.shd h2 span{font-size:21px;color:var(--ink)}
.shd .x{width:46px!important;height:46px!important;border-radius:50%!important;border:2.5px solid var(--gold);background:var(--sheet);font-size:18px}
.tayah{font-family:var(--f-uth);font-size:24px;line-height:2.1;direction:rtl;text-align:center;background:var(--sheet);padding:0 max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.tayah .an{color:var(--ink-soft);font-size:.75em}
.tabs{display:flex;flex-wrap:wrap;gap:0 18px;background:var(--sheet);border-bottom:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.tab{display:flex;align-items:center;gap:8px;padding:10px 2px 9px;font-size:16px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab b{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:7px;background:var(--paper-edge);font-size:12px;font-weight:600;color:var(--ink-soft)}
.tab.on{color:var(--frame);font-weight:700;border-bottom-color:var(--frame)}
.tab.on b{color:var(--frame);background:color-mix(in srgb,var(--frame) 12%,transparent)}
.tab.zero{opacity:.55}
.tnote{font-size:12.5px;color:var(--ink-soft);margin:2px 2px 12px;line-height:1.7}
.wc{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px}

/* mutashabih marks: green = موسوعة التفسير البلاغي, ochre = الدرر, plum = both */

:root[data-theme="dark"]{--mw:#5fd3a6;--mf:#e6bd55;--mb:#5fd3a6;--md:#f0a24a;--me:#7fb2ff;--mn:#ff8a7a;--mz:#5ccfe6;--mx:#e48ad8}
.mw{--mk:var(--mw)}.mf{--mk:var(--mf)}.mb{--mk:var(--mb)}.md{--mk:var(--md)}.me{--mk:var(--me)}.mn{--mk:var(--mn)}.mz{--mk:var(--mz)}.mx{--mk:var(--mx)}
/* clear marking: the ayah number takes the source colour; with marks on, the ayah's words are coloured and set on a tinted band */
/* quiet marking: the page stays black like a printed mushaf; only the ayah rosette takes the source colour */
.w.end.has{color:var(--mk)}
/* the eye button adds a thin line under the words of those ayahs */
body.marks .w.has:not(.end){text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--mk) 55%,transparent);text-decoration-thickness:.06em;text-underline-offset:.32em;text-decoration-skip-ink:none}
body.marks .w.end.has{background:none;box-shadow:none}
body.marks .w.has::after{display:none!important}
body.marks .w.has.hl,.w.hl{color:var(--hl-ink)}

.spread .half{flex:1 1 50%;min-width:0;display:flex;height:100%;padding-block:6px 4px}
.spread .half:first-child{justify-content:flex-end;padding-inline:4.5% 2.2%;border-inline-end:1px solid var(--line)}

async function fetchLivePage(p){

}

/* Surah header: the green arabesque banner of the Madinah 1441 print (img/surah_banner.webp, from the MIT-licensed

function sheadHTML(s,glyph){

    return `<div class="line shead banner" role="heading" aria-label="سورة ${SURAHS[s-1]}"><span class="nm g">${g}</span></div>`}
  const nm=glyph?`<span class="nm g">${glyph}</span>`:`<span class="nm t">سورة ${SURAHS[s-1]}</span>`;
  const fr=glyph||st.headGlyphs?`<span class="fl fr"></span>`:"",fl=glyph||st.headGlyphs?`<span class="fl fl2"></span>`:"";
  return `<div class="line shead" role="heading" aria-label="سورة ${SURAHS[s-1]}"><svg viewBox="0 0 370 46" preserveAspectRatio="none" aria-hidden="true"><path d="M18 3H352L367 23L352 43H18L3 23Z" fill="var(--cart-bg2)" stroke="var(--gold)" stroke-width="1.6"/><path d="M22 7H348L360 23L348 39H22L10 23Z" fill="none" stroke="var(--gold)" stroke-width=".8"/></svg><span class="rule"></span>${fr}${nm}${fl}<span class="rule"></span></div>`}
function prefetch(p){[p+1,p-1,p+2,p-2].forEach(q=>{if(q>=1&&q<=604&&!st.pages[q])fetchLivePage(q).catch(()=>{})})}
function spread(){return matchMedia("(orientation:landscape) and (min-width:900px) and (min-height:600px)").matches}

function renderSpread(A,r,Bp,l){const a=pageHTML(A,r),b=Bp?pageHTML(Bp,l):null;const stage=$("#stage");

function pageHTML(pg,p){
  const d=pg.d,surahs=[];
  const keys=Object.keys(d.vw);
  keys.forEach(k=>{const s=+k.split(":")[0];if(!surahs.includes(s))surahs.push(s);computeWordIdx(k,d.vw[k])});
  d.lines.forEach(([,row])=>row.forEach(it=>{if(it[0]==="h"&&!surahs.includes(it[2]))surahs.push(it[2])}));
  surahs.sort((a,b)=>a-b);
  // the header follows the printed page: the juz that the page opens in the standard page table of the Madinah print (a juz may begin a few lines into its first page: 62, 121, 201, 502)
  const juz=keys.length?juzOfPage(p):null;
  const fo=it=>{const o=it[it.length-1];return o&&typeof o==="object"?o.f:null};
  let html=`<div class="page fixed q4">${runningHead(surahs,juz,null)}<div class="lines" style="font-family:q4f${d.f},var(--f-quran);font-size:${pageFontSize()}px">`;
  d.lines.forEach(([,row])=>{
    const t0=row[0]&&row[0][0];
    if(t0==="h"){html+=sheadHTML(row[0][2],pg.fontOk?row[0][1]:null);return}
    if(t0==="b"){html+=`<div class="line basm" aria-label="بسم الله الرحمن الرحيم"><span style="font-family:q4f${fo(row[0])??d.f}">${row[0][1]}</span></div>`;return}

      if(t==="e"){html+=`<span class="w end${mk(key)}" data-k="${key}" data-i="-1"${sty}>${ch}</span>`;return}
      const wi=pos-1;const ma=markAttr(key,wi);const st2=ma&&f!=null?ma.replace('style="','style="font-family:q4f'+f+';'):(ma||sty);
      html+=`<span class="w${mk(key)}" data-k="${key}" data-i="${wi}"${sty}>${ch}</span>`;

}
function pageFontSize(){if(spread()){const s=$("#stage");return Math.max(15,Math.min(40,Math.min(s.clientWidth/2*.9,s.clientHeight*.64)/17))}const w=Math.min(matchMedia("(orientation:landscape) and (max-height:600px)").matches?640:760,$("#stage").clientWidth-12);return Math.max(15,Math.min(34,w/16.5))}

const NAME_MERGED={"86,87":61896,"91,92":61900,"93,94":61901,"95,96":61902,"97,98":61903,"99,100":61904,"101,102":61905,"103,104,105":61906,"106,107,108":61907,"109,110,111":61908,"112,113,114":61909};
function nameGlyphs(surahs){
  const out=[];let i=0;
  while(i<surahs.length){const s=surahs[i];
    if(s===1){out.push(`<span style="font-size:.46em">${String.fromCharCode(0xF100)}</span>`);i++;continue} // the running-head set has no al-Fatiha; its banner glyph is the same lettering
    if(s>=2&&s<=85){out.push(String.fromCharCode(61812+s-2));i++;continue}
    const k=Object.keys(NAME_MERGED).find(k=>k.split(",").map(Number).includes(s));
    if(k){out.push(String.fromCharCode(NAME_MERGED[k]));i+=1;while(i<surahs.length&&k.split(",").map(Number).includes(surahs[i]))i++;continue}
    return null;}

function runningHead(surahs,juz,rub){

  if(rub){const h=Math.ceil(rub/4),q=(rub-1)%4;right+=`، ${["","ربع ","نصف ","ثلاثة أرباع "][q]}الحزب ${ar(h)}`}
  return `<div class="phead"><span>${right}</span><span class="ps">${surahs.map(s=>SURAHS[s-1]).join(" · ")}</span></div>`;

// Scale the page font so the longest line exactly fills the width, as in the printed page.
function fitLines(box){
  box=box||$("#stage").querySelector(":scope>.page .lines");if(!box)return;
  const avail=box.clientWidth;let max=0;
  box.querySelectorAll(".line:not(.shead):not(.basm)").forEach(l=>{let w=0;for(const c of l.children)w+=c.getBoundingClientRect().width;if(w>max)max=w});
  if(!max)return;const fs=parseFloat(box.style.fontSize)||pageFontSize();
  let nf=fs*(avail*0.99)/max;
  const land=matchMedia("(orientation:landscape) and (max-height:600px)").matches;
  if(false){const n=box.querySelectorAll(".line").length||15;const hMax=box.clientHeight/(n*1.12);if(hMax>8)nf=Math.min(nf,hMax)}
  nf=Math.max(12,Math.min(60,nf));if(Math.abs(nf-fs)>0.3)box.style.fontSize=nf.toFixed(2)+"px";
  // second pass on the real layout: the word widths above leave out the gaps between words, which made the short
  // centred lines of pages 1-2 run past the screen edge; shrink until no line is wider than the page
  const room=st.page<=2?0.9:1; // pages 1-2 sit in a narrower frame in the Madinah print, so keep a margin on both sides
  for(let k=0;k<3;k++){let over=1;
    box.querySelectorAll(".line:not(.shead)").forEach(l=>{let w=l.scrollWidth;if(room<1&&l.children.length){let lo=1e9,hi=-1e9;for(const c of l.children){const b=c.getBoundingClientRect();if(b.width){lo=Math.min(lo,b.left);hi=Math.max(hi,b.right)}}if(hi>lo)w=hi-lo}
      const r=w/Math.max(1,l.clientWidth*room);if(r>over)over=r});
    if(over<=1.002)break;const cur=parseFloat(box.style.fontSize)||nf;box.style.fontSize=Math.max(12,cur/over*0.995).toFixed(2)+"px"}
}

/* keep the screen awake while the mushaf is open. Two means together, since iOS honours them unevenly:
   (1) the Screen Wake Lock API, asked for again whenever the page comes back; (2) a tiny silent video looping
   inline (img/keepawake.mp4), which iOS treats as media playing and so does not dim the screen.
   Both need a tap first, so they start on the first touch. Can be switched off in «عن المصحف». */
let wakeLock=null,awakeVid=null;
function awakeOn(){return store.get("awake",1)!==0}
async function keepAwake(){if(!awakeOn()||document.visibilityState!=="visible")return;
  if("wakeLock" in navigator&&!wakeLock){try{wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}catch(e){}}
  if(!awakeVid){awakeVid=document.createElement("video");awakeVid.setAttribute("playsinline","");awakeVid.setAttribute("muted","");awakeVid.muted=true;awakeVid.loop=true;
    awakeVid.setAttribute("aria-hidden","true");awakeVid.style.cssText="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1";
    awakeVid.src="img/keepawake.mp4";document.body.appendChild(awakeVid)}
  if(awakeVid.paused)awakeVid.play().catch(()=>{})}
function stopAwake(){if(wakeLock)wakeLock.release().catch(()=>{});wakeLock=null;if(awakeVid){awakeVid.pause()}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});
["click","touchend"].forEach(ev=>document.addEventListener(ev,()=>{if(awakeOn()&&(!wakeLock||!awakeVid||awakeVid.paused))keepAwake()},{passive:true}));
keepAwake();

/* ---------- Sharing one ayah and everything said about it as a PDF ----------
   Page 1: the ayah (KFGQPC text) and a contents list, one line per entry, grouped by source.
   Then every entry in full: its title, place in the book, the compared verses, the summary, the text and the sources.
   Pages are drawn on a canvas (Arabic shaping and the mushaf font come out right) and wrapped by jsPDF (vendor, MIT),
   which also carries the links from the contents to each entry. */
const PDFW=1240,PDFH=1754,PM=80,PDF_UI='"IBM Plex Sans Arabic",system-ui,sans-serif',PDF_Q='"KFGQPC Hafs","Amiri Quran",serif',PDF_R='"Noto Naskh Arabic","Amiri",serif',PDF_D='"Amiri",serif';
const PDF_SRC={w:"#0f7a55",f:"#a7822e"};
const SITE=location.origin;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function pdfCanvas(){const c=document.createElement("canvas");c.width=PDFW;c.height=PDFH;const x=c.getContext("2d");
  x.fillStyle="#fffdf7";x.fillRect(0,0,PDFW,PDFH);x.direction="rtl";x.textAlign="right";x.textBaseline="alphabetic";return {c,x,links:[]}}
function wrapLines(x,text,maxW){const ws=String(text||"").split(/\s+/).filter(Boolean);const out=[];let cur="";
  for(const w of ws){const t=cur?cur+" "+w:w;if(cur&&x.measureText(t).width>maxW){out.push(cur);cur=w}else cur=t}if(cur)out.push(cur);return out}
// one entry as printable parts: [kind, text]
function entryParts(e){const r=e.r,P=[];
  if(e.t==="w"){const [m,sn,a,t,p]=r;P.push(["title","مسألة "+arL(m)]);P.push(["meta",`«وعلامات» · ص ${ar(p)} · سورة ${SURAHS[sn-1]} · الآية ${arL(a)}`]);t.split(" / ").forEach(v=>P.push(["verse",v.trim()]));return P}
  if(e.t==="f"){const [sn,a,p,y,x,g]=r;P.push(["title",y+(g?" · ★ "+g:"")]);P.push(["meta",`«وعلامات» · ص ${ar(p)} · سورة ${SURAHS[sn-1]}`]);P.push(["p",x]);return P}
  if(e.t==="b"){const ay=r[14];
    P.push(["title",r[13]]);if(r[5]&&r[5]!==r[13])P.push(["sub",r[5]]);
    P.push(["meta",`موسوعة التفسير البلاغي · ${arL(r[3])} · سورة ${SURAHS[r[1]-1]}${ay?" · "+(ay[0]===ay[1]?"الآية "+ar(ay[0]):"الآيات "+ar(ay[0])+"–"+ar(ay[1])):""}${r[6].length?" · يقارن بـ: "+r[6].map(arL).join("، "):""}`]);
    String(r[7]||"").split("\n").map(s=>s.trim()).filter(Boolean).forEach(p=>P.push(["p",p]));
    P.push(["src",r[8].length?r[8].join(" · "):"لم تذكر الموسوعة لهذا المبحث مصدرًا."]);}
  else if(e.t==="d"){P.push(["title",(r[4]||"متشابه لفظي")+" · "+arL(r[3])]);
    P.push(["meta","موسوعة التفسير · الدرر السنية"+(r[11]?" · "+r[11]:"")]);
    r[6].forEach(v=>P.push(["verse",arL(v[1])+": ﴿"+v[2]+"﴾"]));
    if(r[7])P.push(["sum",r[7]]);
    (r[10]||[]).forEach(p=>P.push(["p",p]));
    P.push(["src",r[8].length&&!r[9]?r[8].map(s=>s[0]+" "+arL(s[1])).join(" · "):"لم تذكر الموسوعة لهذا الموضع مصدرًا."]);}
  else{const bd=META.EB[e.i]||[[],[]];P.push(["title",r[2]]);
    P.push(["meta",`استدراك ما فات من بلاغة الآيات المتشابهات (سعد عبد العظيم محمد) · ${r[1]} · سورة ${SURAHS[r[0]-1]}`]);
    r[3].forEach(v=>{const m=v.match(/^(﴿.*﴾)\s*\[([^\]]+)\]/);if(!m)return;const [aa,ss]=m[2].split("/");const sI=+ss.replace(/[٠-٩]/g,d=>AR.indexOf(d));P.push(["verse",(SURAHS[sI-1]||"")+": "+aa+" "+m[1]])});
    bd[0].forEach(p=>P.push(["p",p]));if(bd[1].length)P.push(["src",bd[1].join(" · ")]);}
  return P}
async function buildAyahPdf(){
  const S=sheetState;const {s:sn,a,es,key}=S;
  try{await Promise.all([`48px ${PDF_Q}`,`600 28px ${PDF_UI}`,`400 26px ${PDF_UI}`,`400 27px ${PDF_R}`,`700 30px ${PDF_R}`,`700 40px ${PDF_D}`].map(f=>document.fonts.load(f)))}catch(e){}
  
  if(!window.jspdf)await loadScript("vendor/jspdf.umd.min.js");
  const order=ON.filter(t=>t!=="n"&&t!=="z"&&(!st.only||st.only===t));const list=order.flatMap(t=>[...es.filter(e=>e.t===t&&!e.role),...es.filter(e=>e.t===t&&e.role)]);
  const pages=[];let P=pdfCanvas();pages.push(P);let y=0;const R=PDFW-PM,L=PM,CW=PDFW-2*PM;
  const foot=(pg,n)=>{const x=pg.x;x.font=`400 20px ${PDF_UI}`;x.fillStyle="#8a8070";x.textAlign="center";
    x.fillText(`مصحف «وعلامات» · ${SITE.replace("https://","")} · ${ar(n)}`,PDFW/2,PDFH-40);x.textAlign="right";
    pg.links.push({x:PM,y:PDFH-70,w:CW,h:44,url:SITE+"/#"+sn+"-"+a})};
  const head=(pg,title)=>{const x=pg.x;x.fillStyle="#14463f";x.fillRect(0,0,PDFW,120);x.fillStyle="#fff";x.font=`700 40px ${PDF_D}`;
    x.fillText(`سورة ${SURAHS[sn-1]} · الآية ${ar(a)}`,R,78);x.font=`400 22px ${PDF_UI}`;x.textAlign="left";x.fillText(title,L,76);x.textAlign="right";return 170};
  const newPage=title=>{foot(P,pages.length);P=pdfCanvas();pages.push(P);y=head(P,title)};
  // ----- page 1: the ayah and the contents -----
  y=head(P,"ضبط المتشابه · «وعلامات»");
  const disp=st.ayahText[key]&&st.ayahText[key].length?st.ayahText[key]:(st.ayahWords[key]||[]);
  const x0=P.x;x0.font=`48px ${PDF_Q}`;const lh=96,space=x0.measureText(" ").width*1.1;let xr=R;y+=40;
  disp.forEach(w=>{if(!w)return;const wd=x0.measureText(w).width;if(xr-wd<L){xr=R;y+=lh}x0.fillStyle="#1b1b1b";x0.fillText(w,xr,y);xr-=wd+space});
  x0.font=`40px ${PDF_Q}`;const an=`﴿${ar(a)}﴾`;const aw=x0.measureText(an).width;if(xr-aw<L){xr=R;y+=lh}x0.fillStyle="#a7822e";x0.fillText(an,xr,y);
  y+=70;x0.font=`600 26px ${PDF_UI}`;x0.fillStyle="#14463f";x0.fillText(`ما قيل في هذه الآية (${ar(list.length)})`,R,y);y+=18;
  x0.font=`400 21px ${PDF_UI}`;x0.fillStyle="#5d5442";y+=30;x0.fillText("اضغط أي سطر للانتقال إلى نصه كاملًا.",R,y);y+=24;
  const toc=[];let lastT=null;
  list.forEach(e=>{if(e.t!==lastT){lastT=e.t;if(y+90>PDFH-110)newPage("المحتويات (تابع)");P.x.font=`700 28px ${PDF_R}`;P.x.fillStyle=PDF_SRC[e.t];y+=50;P.x.fillText(SRC[e.t].title,R,y);y+=10}
    const t=entryParts(e)[0][1]+(e.role?" (تُقارَن بها هذه الآية)":"");const X=P.x;X.font=`400 24px ${PDF_UI}`;const ls=wrapLines(X,t,CW-40).slice(0,2);
    if(y+ls.length*36+16>PDFH-110)newPage("المحتويات (تابع)");
    const y0=y;P.x.fillStyle="#1b1b1b";P.x.font=`400 24px ${PDF_UI}`;ls.forEach(l=>{y+=36;P.x.fillText(l,R-24,y)});
    P.x.fillStyle=PDF_SRC[e.t];P.x.fillRect(R-10,y0+14,5,y-y0-4);
    toc.push({e,page:pages.length-1,x:L,y:y0+6,w:CW,h:y-y0+10});y+=10});
  // ----- every entry in full -----
  newPage("المسائل والفوائد");
  list.forEach(e=>{const parts=entryParts(e);
    if(y+200>PDFH-110)newPage("نصوص المصادر (تابع)");
    e._page=pages.length-1;const col=PDF_SRC[e.t];
    P.x.fillStyle=col;P.x.globalAlpha=.08;P.x.fillRect(L,y,CW,8);P.x.globalAlpha=1;y+=30;
    parts.forEach(([k,t])=>{const X=P.x;
      const f=k==="title"?`700 30px ${PDF_R}`:k==="sub"?`400 25px ${PDF_R}`:k==="meta"?`400 20px ${PDF_UI}`:k==="verse"?`34px ${PDF_Q}`:k==="sum"?`500 25px ${PDF_R}`:k==="src"?`400 19px ${PDF_UI}`:`400 26px ${PDF_R}`;
      const lhh=k==="title"?50:k==="verse"?62:k==="meta"||k==="src"?32:k==="sub"?42:46;const ind=k==="sum"?24:0;
      X.font=f;const ls=wrapLines(X,t,CW-ind-10);
      ls.forEach(l=>{if(y+lhh>PDFH-110){newPage("نصوص المصادر (تابع)");P.x.font=f}
        const Y=P.x;Y.fillStyle=k==="title"?col:k==="meta"||k==="src"?"#7a7062":k==="sub"?"#8a5a12":k==="verse"?"#14463f":"#1b1b1b";
        if(k==="sum"){Y.fillStyle=col;Y.fillRect(R-4,y+8,4,lhh-6);Y.fillStyle="#2b2b2b"}
        y+=lhh;Y.fillText(l,R-ind,y-(lhh*.25))});
      y+=k==="p"?8:k==="title"?2:6});
    y+=26;P.x.strokeStyle="#e8dfc8";P.x.lineWidth=1.5;P.x.beginPath();P.x.moveTo(L,y);P.x.lineTo(R,y);P.x.stroke();y+=24});
  foot(P,pages.length);
  toc.forEach(t=>pages[t.page].links.push({x:t.x,y:t.y,w:t.w,h:t.h,page:t.e._page}));
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"pt",format:"a4",compress:true});const k=595.28/PDFW;
  pages.forEach((pg,n)=>{if(n)doc.addPage();doc.addImage(pg.c.toDataURL("image/jpeg",.86),"JPEG",0,0,595.28,841.89);
    pg.links.forEach(l=>{if(l.url)doc.link(l.x*k,l.y*k,l.w*k,l.h*k,{url:l.url});else doc.link(l.x*k,l.y*k,l.w*k,l.h*k,{pageNumber:l.page+1})})});
  doc.setProperties({title:`توجيه المتشابه — سورة ${SURAHS[sn-1]} الآية ${a}`,creator:"مصحف المتشابهات"});
  return {blob:doc.output("blob"),name:`متشابه ${SURAHS[sn-1]} ${ar(a)}.pdf`};
}
async function shareAyahPdf(){
  const btn=$("#shShare");if(btn.disabled||!sheetState)return;btn.disabled=true;toast("جارٍ إعداد ملف PDF…");
  let r;try{r=await buildAyahPdf()}catch(e){btn.disabled=false;toast("تعذّر إعداد الملف");console.error(e);return}
  btn.disabled=false;const file=new File([r.blob],r.name,{type:"application/pdf"});const url=URL.createObjectURL(r.blob);
  document.querySelectorAll(".pdfdlg").forEach(x=>x.remove());
  const d=document.createElement("div");d.className="pdfdlg";
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  d.innerHTML=`<p>ملف PDF جاهز: ${esc(r.name.replace(/\.pdf$/,""))}</p><div class="row">${canShare?`<button class="main" data-a="share">مشاركة (واتساب وغيره)</button>`:""}<a ${canShare?"":'class="main"'} href="${url}" download="${esc(r.name)}" target="_blank" rel="noopener">فتح الملف</a><button data-a="close">إغلاق</button></div>`;
  document.body.appendChild(d);
  d.onclick=async e=>{const t=e.target.closest("[data-a]");if(!t)return;
    if(t.dataset.a==="share"){try{await navigator.share({files:[file],title:r.name})}catch(err){}}
    if(t.dataset.a==="close"||t.dataset.a==="share"){d.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}};
}
$("#shShare").onclick=shareAyahPdf;window.buildAyahPdf=buildAyahPdf;

  $("#stage").querySelectorAll(".page .lines").forEach(l=>{l.style.fontSize=pageFontSize()+"px";fitLines(l)})});
